[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-inteligente-arquivos"
version = "1.0.0"
description = "Organizador seguro de arquivos por regras configuraveis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Daniel" }
]
keywords = ["automacao", "arquivos", "cli", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.scripts]
organizer = "organizer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
